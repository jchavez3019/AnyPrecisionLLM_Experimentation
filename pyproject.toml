[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyprec"
version = "0.1.0"
description = "From-scratch PyTorch reproduction of Any-Precision LLM quantization on IBM Granite."
requires-python = ">=3.13"
# The CUDA-enabled torch build is provisioned by environment.yaml from the cu126 index.
# Do not install torch from PyPI directly or you will get a CPU-only wheel.
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=3.0",
    "hydra-core>=1.3",
    "Jinja2",
    "lm-eval>=0.4.13",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openai",
    "pydantic>=2.6",
    "python-dotenv",
    "safetensors>=0.4",
    "tabulate>=0.9",
    "torch>=2.9,<2.10",
    "tqdm>=4.66",
    # GraniteMoeHybridForCausalLM is verified in 5.17.0 (ADR 0002).
    "transformers>=5.17",
]

# No [project.scripts] entry points yet; run experiments directly, e.g.:
#   python quantization/quantize_any_precision.py
# Entry scripts import the installable library after a one-time `pip install -e .`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anyprec = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "quantization", "evaluation", "tests"]
extend-exclude = ["any-precision-llm", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Long lines occur in tensor-shape comments; the formatter handles code width.
    "E501",
]

[tool.pyright]
include = ["src", "quantization", "evaluation", "tests"]
exclude = ["any-precision-llm", "outputs", "**/__pycache__"]
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: requires a CUDA device",
    "slow: long-running quantization or evaluation jobs",
    "network: downloads from the Hugging Face Hub or calls a remote endpoint; opt-in via -m network",
]
addopts = "-m 'not gpu and not slow and not network'"
