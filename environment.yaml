name: AnyPrecLLM

# Mirrors the E2E_RAG environment (ADR 0002). The `pytorch`/`nvidia` conda channels do not
# publish CUDA-enabled builds for Python 3.13, so PyTorch is installed from its own pip CUDA
# index below, and conda-forge is the only conda channel.
#
# Hugging Face libraries, lm-eval, and the judge client are NOT listed here: conda-forge's
# `transformers` would pull a CPU-only conda PyTorch. They are installed from PyPI by the
# editable install of this project, after the CUDA wheel is already in place:
#
#   conda env create -f environment.yaml
#   conda activate AnyPrecLLM
#   pip install -e .
channels:
  - conda-forge

dependencies:
  - python=3.13
  - pip
  # --- numeric support ---
  - numpy>=1.26,<2.3
  - scipy>=1.11
  - matplotlib>=3.8
  # --- configuration / contracts ---
  - hydra-core>=1.3
  - pydantic>=2.6
  # --- notebook execution ---
  #   ipywidgets resolves tqdm's "IProgress not found" warning in Jupyter.
  - ipykernel
  - ipywidgets>=8.1
  - nbformat>=5.9
  - nbconvert>=7
  # --- dev / quality gates (ADR 0001) ---
  - pytest>=7.4
  - pytest-cov>=5.0
  - hypothesis>=6.100
  - ruff>=0.4
  - pyright>=1.1.360
  # --- CUDA-enabled PyTorch via pip ---
  #   `--index-url` (not `--extra-index-url`) resolves torch solely against the CUDA wheel
  #   index, guaranteeing the `+cu126` build. CUDA 12.6 matches the local driver. The 2.9.x
  #   line matches E2E_RAG and provides `Tensor.register_post_accumulate_grad_hook` (ADR 0003).
  - pip:
      - --index-url https://download.pytorch.org/whl/cu126
      - torch>=2.9,<2.10
